[project]
name = "foundationpose"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "fvcore>=0.1.5.post20221221",
    "h5py>=3.15.1",
    "imageio>=2.37.2",
    "joblib>=1.5.3",
    "kornia>=0.8.2",
    "omegaconf>=2.3.0",
    "open3d>=0.19.0",
    "opencv-python>=4.13.0.90",
    "pandas>=2.3.3",
    "psutil>=7.2.1",
    "scipy>=1.17.0",
    "transformations>=2026.1.18",
    "trimesh>=4.11.1",
    "warp-lang>=1.11.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "nvdiffrast",
    "mycuda",
    "pytorch3d",
    "ruamel-yaml>=0.19.1",
    "mycpp",
]


[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git"}
mycuda = { workspace = true }
mycpp = { workspace = true }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.extra-build-dependencies]
nvdiffrast = [{ requirement = "torch", match-runtime = true }]
pytorch3d = ["torch"]

[tool.uv.workspace]
members = [
    "bundlesdf/mycuda",
    "_mycpp",
]
